name: wgsl4k CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: macos-26 # Xcode 26 is required for the iOS toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Determine test strategy
        id: test-strategy
        run: |
          if [[ "${{ github.base_ref }}" == "master" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "strategy=deep" >> "$GITHUB_OUTPUT"
          else
            echo "strategy=fast-track" >> "$GITHUB_OUTPUT"
          fi

      - name: Run JVM fast-track tests
        if: steps.test-strategy.outputs.strategy == 'fast-track'
        run: ./gradlew jvmTest checkKotlinAbi koverVerifyJvm compileAndroidMain --no-daemon --stacktrace

      - name: Run integration test suite
        if: steps.test-strategy.outputs.strategy == 'deep'
        run: ./gradlew allTests checkKotlinAbi koverVerifyJvm compileAndroidMain --no-daemon --stacktrace
