name: Publish wgsl4k artifacts to Maven Central

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Release version override (defaults to 1.0.0-SNAPSHOT)
        required: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate WGSL ABI
        run: >-
          ./gradlew :wgsl:wgsl-core:checkKotlinAbi :wgsl:wgsl-parser:checkKotlinAbi
          :wgsl:wgsl-generator:checkKotlinAbi :wgsl:wgsl-tests:checkKotlinAbi
          :wgsl:wgsl-cli:checkKotlinAbi --no-daemon --stacktrace

      - name: Set publication version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: echo "VERSION=${INPUT_VERSION:-1.0.0-SNAPSHOT}" >> "$GITHUB_ENV"

      - name: Report unavailable publishing credentials
        if: env.MAVEN_CENTRAL_USERNAME == '' || env.MAVEN_CENTRAL_PASSWORD == '' || env.SIGNING_KEY == '' || env.SIGNING_PASSWORD == ''
        run: echo "Maven Central or signing credentials are unavailable; publication is skipped."

      - name: Publish WGSL artifacts
        if: env.MAVEN_CENTRAL_USERNAME != '' && env.MAVEN_CENTRAL_PASSWORD != '' && env.SIGNING_KEY != '' && env.SIGNING_PASSWORD != ''
        run: >-
          ./gradlew :wgsl:wgsl-core:publishToMavenCentral :wgsl:wgsl-parser:publishToMavenCentral
          :wgsl:wgsl-generator:publishToMavenCentral :wgsl:wgsl-tests:publishToMavenCentral
          :wgsl:wgsl-cli:publishToMavenCentral --no-configuration-cache --no-daemon --stacktrace
          -PreleaseVersion="${VERSION}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
